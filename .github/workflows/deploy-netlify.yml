name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: netlify-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 266a9cab-8cff-44ed-a70d-f6638818fa7b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production (main)
        if: github.event_name != 'pull_request'
        run: npx --yes netlify-cli@latest deploy --build --prod

      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        run: npx --yes netlify-cli@latest deploy --build --alias pr-${{ github.event.pull_request.number }}
